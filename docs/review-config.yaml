version: 1

defaults:
  mode: draft
  publish: none
  local_output_dir: docs/review
  github_issue_skill_command: /sc-gh-issue

reviews:
  tools:
    process_name: tools
    display_name: Tools review
    inputs:
      primary:
        - tools/
      criteria:
        - docs/tools_guidelines.md
    scope:
      milestone: none
    outputs:
      naming: review-tools{milestone_suffix}
      template: none
