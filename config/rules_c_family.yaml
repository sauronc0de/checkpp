clang_tidy_checks:
  - -*
  - clang-analyzer-*
  - bugprone-*
  - readability-braces-around-statements
  - readability-misleading-indentation
  - readability-redundant-preprocessor

checks:
  company-file-snake-case:
    rule_id: "C-5.1"
    enabled: true
    severity: error

  company-global-function-module-prefix:
    rule_id: "C-7.1"
    enabled: true
    severity: error

  company-global-variable-module-prefix:
    rule_id: "C-7.2"
    enabled: true
    severity: warning

  company-local-variable-snake-case:
    rule_id: "C-7.3"
    enabled: true
    severity: warning

  company-enum-value-upper-case:
    rule_id: "C-7.4"
    enabled: true
    severity: warning

  company-macro-upper-case:
    rule_id: "C-7.5"
    enabled: true
    severity: warning

  company-no-tabs:
    rule_id: "C-2.1"
    enabled: true
    severity: error

  company-line-length:
    rule_id: "C-2.2"
    enabled: true
    severity: error
    max_length: 80
